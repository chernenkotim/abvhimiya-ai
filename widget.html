<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Онлайн-консультант ABV Himiya</title><link rel="stylesheet" href="/static/widget.css"></head>
<body>
<h2>Онлайн-консультант ABV Himiya</h2>
<div id="ai-proactive-bubble">Підказати сумісність клею чи витрату на площу? 👋</div>
<div id="ai-chat-launcher" role="button" tabindex="0" aria-label="Відкрити чат">💬</div>
<div id="ai-chat-window" role="dialog" aria-label="Чат ABV Himiya">
  <div id="ai-chat-header"><div><div>Технічний консультант</div><div style="font-size:11px;font-weight:400;opacity:.9">abvhimiya.com.ua</div></div><button id="ai-chat-close" aria-label="Закрити чат" style="background:none;border:0;color:#fff;cursor:pointer;font-size:18px">✕</button></div>
  <div id="ai-chat-messages" aria-live="polite">
    <div class="msg bot">Вітаю! Чим можу допомогти? Підкажу щодо вибору будівельної хімії чи допоможу зв’язатися з менеджером для перевірки статусу замовлення!</div>
    <div class="quick-chips-box">
      <button type="button" class="quick-chip" data-question="Де моє замовлення?">📦 Де моє замовлення?</button>
      <button type="button" class="quick-chip" data-question="Фарба для ванни є?">🛁 Фарба для ванни</button>
      <button type="button" class="quick-chip" data-question="Порадь епоксидний клей для металу">🧪 Епоксидний клей</button>
      <button type="button" class="quick-chip" data-question="Який філамент PLA є в наявності?">🧵 Пластик для 3D</button>
      <button type="button" class="quick-chip" data-manager="1">📞 Менеджер</button>
    </div>
  </div>
  <div id="ai-chat-input-box"><input type="text" id="ai-chat-input" maxlength="2000" placeholder="Запитайте про товар або введіть назву..." aria-label="Ваше питання"><button id="ai-chat-send">➤</button></div>
  <div id="fast-order-modal" role="dialog" aria-label="Швидке замовлення">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">⚡ Швидке замовлення</div>
      <div id="modal-product-name" style="font-size:12.5px;color:#475569;margin-bottom:10px"></div>
      <input type="text" id="fast-name" class="modal-input" maxlength="100" placeholder="Ваше ім'я" autocomplete="name">
      <input type="tel" id="fast-phone" class="modal-input" maxlength="32" placeholder="Номер телефону (+380...)" autocomplete="tel">
      <label style="display:flex;gap:7px;font-size:11px;align-items:start;color:#475569"><input type="checkbox" id="fast-consent"> Погоджуюся на обробку контактних даних для опрацювання звернення</label>
      <div id="modal-error" style="color:#b91c1c;font-size:12px;margin:6px 0" role="alert"></div>
      <div class="modal-btns"><button type="button" class="btn-cancel" id="modal-cancel">Скасувати</button><button type="button" class="btn-submit" id="modal-submit">Замовити</button></div>
    </div>
  </div>
</div>
<script src="/static/widget.js" defer></script>
</body></html>
